name: Admin recovery frontend build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/admin-dashboard-recovery
  workflow_dispatch:

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend dependencies
        working-directory: client
        run: npm ci
      - name: Build frontend
        working-directory: client
        run: npm run build
